<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  
  <!-- Section 5: Social Preview (Open Graph) -->
  <title>SweetInvite — ไปเที่ยวด้วยกันนะ!</title>
  <meta name="description" content="คำชวนพิเศษส่งถึงคุณ... ลองเปิดดูสิ ✨">
  <meta property="og:title" content="SweetInvite — มีคำชวนส่งถึงคุณ ✨">
  <meta property="og:description" content="ว่างๆ ไปหาอะไรอร่อยๆ ทาน หรือไปเที่ยวด้วยกันไหม?">
  <meta property="og:image" content="preview.png"> 
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&family=Anuphan:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #9b7653; 
      --primary-dark: #6f4e37;
      --secondary: #fdfaf5; 
      --accent: #d4a373; 
      --text-main: #4a3728;
      --text-muted: #8c7b6c;
      --bg-gradient: linear-gradient(135deg, #fdfaf5 0%, #f1e4d3 100%);
      --card-bg: rgba(255, 255, 255, 0.75);
      --shadow: 0 15px 35px rgba(155, 118, 83, 0.15);
      --bezier: cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Anuphan', sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      line-height: 1.6;
      padding: 20px;
    }

    h1, h2, h3, .font-modern {
      font-family: 'Kanit', sans-serif;
      font-weight: 600;
    }

    /* Background Animation */
    .bg-star {
      position: fixed;
      color: var(--accent);
      opacity: 0.3;
      z-index: -1;
      animation: starTwinkle var(--d) ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes starTwinkle { 0%, 100% { transform: scale(1) rotate(0deg); opacity: 0.2; } 50% { transform: scale(1.4) rotate(180deg); opacity: 0.4; } }

    #app {
      width: 100%;
      max-width: 450px;
      position: relative;
    }

    .screen {
      display: none;
      animation: screenIn 0.7s var(--bezier) forwards;
      width: 100%;
    }
    .screen.active { display: block; }
    @keyframes screenIn {
      from { opacity: 0; transform: translateY(20px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Envelope Responsive */
    .envelope-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    .envelope {
      position: relative;
      width: min(300px, 85vw);
      height: min(200px, 55vw);
      background: #c2a385;
      border-radius: 12px;
      box-shadow: var(--shadow);
      cursor: pointer;
      transform-style: preserve-3d;
      transition: all 0.5s var(--bezier);
    }
    .envelope:hover { transform: translateY(-8px); }
    
    .envelope-front {
      position: absolute;
      inset: 0;
      background: #c2a385;
      border-radius: 12px;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255,255,255,0.2);
    }
    .envelope-flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #b08d6d;
      clip-path: polygon(0 0, 50% 60%, 100% 0);
      z-index: 4;
      transform-origin: top;
      transition: transform 0.7s var(--bezier);
      border-top-left-radius: 12px;
      border-top-right-radius: 12px;
    }
    .envelope.open-anim .envelope-flap { transform: rotateX(180deg); z-index: 1; }
    
    .seal-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -30%);
      width: 56px;
      height: 56px;
      background: var(--primary-dark);
      border-radius: 50%;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      border: 2px solid var(--accent);
      transition: all 0.3s;
    }
    .envelope.open-anim .seal-btn { opacity: 0; transform: translate(-50%, -100%) scale(0); }

    /* Card Styling */
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 28px;
      padding: clamp(30px, 8vw, 45px) 24px;
      box-shadow: var(--shadow);
      text-align: center;
      width: 100%;
    }

    h1 { font-size: clamp(24px, 7vw, 30px); color: var(--primary-dark); margin-bottom: 12px; }
    p.sub-text { font-size: clamp(15px, 4vw, 17px); margin-bottom: 28px; color: var(--text-main); }

    /* Button Group & No Button Trash Logic */
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
      min-height: 130px;
    }
    .btn {
      padding: 16px;
      border-radius: 100px;
      font-family: 'Kanit', sans-serif;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s var(--bezier);
      border: none;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-yes {
      background: var(--primary);
      color: white;
      box-shadow: 0 8px 20px rgba(155, 118, 83, 0.25);
    }
    .btn-no {
      background: white;
      color: var(--text-muted);
      border: 1.5px solid #e2d9cf;
      position: relative;
    }

    /* Trash Bin Visual */
    #trash-bin {
      position: fixed;
      bottom: 40px;
      right: 40px;
      width: 80px;
      height: 80px;
      background: #f1f3f4;
      border: 2px solid #dadce0;
      border-radius: 50%;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      z-index: 900;
      animation: binIn 0.5s var(--bezier) forwards;
    }
    @keyframes binIn {
      from { transform: scale(0) rotate(-45deg); opacity: 0; }
      to { transform: scale(1) rotate(0); opacity: 1; }
    }
    #trash-bin.shake { animation: binShake 0.4s ease; }
    @keyframes binShake {
      0%, 100% { transform: scale(1.1); }
      25% { transform: scale(1.1) rotate(10deg); }
      75% { transform: scale(1.1) rotate(-10deg); }
    }

    /* Trash Animation for Button */
    .crumple-throw-to-bin {
      animation: crumpleToBin 0.8s cubic-bezier(0.55, 0, 0.1, 1) forwards;
    }
    @keyframes crumpleToBin {
      0% { transform: scale(1); }
      30% { transform: scale(0.6) rotate(20deg); opacity: 0.9; }
      100% { 
        left: calc(100vw - 80px); 
        top: calc(100vh - 80px); 
        transform: scale(0) rotate(720deg); 
        opacity: 0; 
      }
    }

    /* Planner Layout */
    .planner-card { text-align: left; }
    .label {
      font-family: 'Kanit', sans-serif;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--primary-dark);
      margin: 20px 0 8px;
      display: block;
      font-weight: 600;
    }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    input, textarea {
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      border: 1.5px solid #e8dccb;
      background: white;
      font-family: 'Anuphan', sans-serif;
      font-size: 15px;
      outline: none;
    }

    .chip-container { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      padding: 8px 16px;
      border-radius: 100px;
      background: white;
      border: 1.5px solid #e8dccb;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .chip.selected {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
      box-shadow: 0 4px 10px rgba(155, 118, 83, 0.2);
    }

    /* Success Elements */
    .summary-box {
      background: #fdfaf5;
      border-radius: 20px;
      padding: 20px;
      margin: 20px 0;
      text-align: left;
      font-size: 14px;
      border: 1px dashed var(--accent);
    }
    .sum-line { display: flex; justify-content: space-between; margin-bottom: 8px; gap: 10px; }
    .sum-val { font-weight: 500; text-align: right; }

    /* Loading */
    .loader {
      position: fixed;
      inset: 0;
      background: rgba(253, 250, 245, 0.9);
      z-index: 2000;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .loader.active { display: flex; }

    @media (max-width: 400px) {
      .card { padding: 30px 20px; }
      .grid-2 { grid-template-columns: 1fr; }
      #trash-bin { bottom: 20px; right: 20px; width: 60px; height: 60px; font-size: 24px; }
    }
  </style>
</head>
<body>

  <!-- Background Stars -->
  <script>
    for(let i=0; i<12; i++) {
      const star = document.createElement('div');
      star.className = 'bg-star';
      star.innerHTML = '✨';
      star.style.left = Math.random() * 100 + 'vw';
      star.style.top = Math.random() * 100 + 'vh';
      star.style.fontSize = (12 + Math.random() * 18) + 'px';
      star.style.setProperty('--d', (4 + Math.random() * 4) + 's');
      document.body.appendChild(star);
    }
  </script>

  <div id="app">
    <!-- Screen 0: Envelope -->
    <div id="screen-envelope" class="screen active">
      <div class="envelope-wrapper">
        <div class="envelope" id="envelope" onclick="openEnvelope()">
          <div class="envelope-flap"></div>
          <div class="envelope-front"></div>
          <div class="seal-btn">⭐</div>
        </div>
        <p class="font-modern" style="color:var(--text-muted); font-size:14px;">แตะเพื่อเปิดคำชวน ✨</p>
      </div>
    </div>

    <!-- Screen 1: Intro -->
    <div id="screen-intro" class="screen">
      <div class="card">
        <div style="font-size:50px; margin-bottom:15px;">🌟</div>
        <h1>ไปเที่ยวกันไหม?</h1>
        <p class="sub-text">ช่วงนี้มีที่น่าสนใจหลายที่เลย อยากชวนคุณออกไปพักผ่อนด้วยกันสักวัน สนไหม?</p>
        <div class="btn-group" id="btn-group">
          <button class="btn btn-yes" onclick="playHaptic(); showScreen('screen-planner')">ตกลง ไปด้วยกันสิ! ✨</button>
          <button class="btn btn-no" id="btn-no" 
            onmouseover="runAway()" 
            ontouchstart="runAway()" 
            onclick="handleNoClick()">ไว้วันหลังนะ...</button>
        </div>
      </div>
    </div>

    <!-- Screen 2: Planner -->
    <div id="screen-planner" class="screen">
      <div class="card planner-card">
        <h1>นัดแนะกันเถอะ ✨</h1>
        
        <label class="label">วันและเวลาที่สะดวก</label>
        <div class="grid-2">
          <input type="date" id="date-input">
          <input type="time" id="time-input" value="11:00">
        </div>

        <label class="label">ที่ที่อยากไป (เลือกได้หลายที่)</label>
        <div class="chip-container" id="places-container"></div>
        <div style="display:flex; gap:8px; margin-top:10px;">
          <input type="text" id="custom-place" placeholder="เพิ่มที่อื่นๆ...">
          <button onclick="addCustomPlace()" style="padding:0 15px; border-radius:12px; border:none; background:var(--secondary); color:var(--primary-dark); cursor:pointer;">+</button>
        </div>

        <label class="label">อยากทำกิจกรรมอะไรบ้าง?</label>
        <div class="chip-container" id="activities-container"></div>

        <label class="label">อาหารที่อยากทาน</label>
        <div class="chip-container" id="foods-container"></div>

        <label class="label">ฝากข้อความถึงฉัน</label>
        <textarea id="note-input" rows="2" placeholder="อยากบอกอะไรเพิ่มไหม..."></textarea>

        <button class="btn btn-yes" style="margin-top: 25px;" onclick="sendInvite()">ส่งคำนัดหมาย 💌</button>
      </div>
    </div>

    <!-- Screen 3: Success -->
    <div id="screen-success" class="screen">
      <div class="card">
        <div style="font-size:60px; margin-bottom:20px;">✨</div>
        <h1>ส่งเรียบร้อยแล้ว!</h1>
        <p>ขอบคุณนะ! เดี๋ยวฉันเช็คตารางแล้วจะรีบบอกคุณนะ</p>
        <div class="summary-box" id="summary-box"></div>
        <p class="font-modern" style="color:var(--primary-dark);">ไว้เจอกันนะ! ⭐</p>
      </div>
    </div>
  </div>

  <!-- Trash Bin Visual Element -->
  <div id="trash-bin">🗑️</div>

  <div class="loader" id="loading">
    <div style="font-size:40px; animation: spin 2s linear infinite;">✨</div>
    <p style="margin-top:15px; font-family:'Kanit';">กำลังส่งนัดหมาย...</p>
  </div>

  <!-- Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
  
  <script>
    const EMAILJS_SERVICE_ID = 'service_gijv5fl';
    const EMAILJS_TEMPLATE_ID = 'template_7meyv3j';
    const EMAILJS_PUBLIC_KEY = '2K44__eJ4YzSyU6ll';
    const RECIPIENT_EMAIL = 'rito555za@gmail.com';

    const PLACES = ["เยาวราช", "อารีย์", "ทองหล่อ", "สยาม", "บรรทัดทอง", "เจริญกรุง", "ไอคอนสยาม"];
    const ACTIVITIES = ["🎬 ดูหนัง", "🖼️ เดินชมนิทรรศการ", "🎳 โบว์ลิ่ง", "🎤 ร้องคาราโอเกะ", "🛍️ ช้อปปิ้ง", "🌳 เดินเล่นในสวน", "🎨 ทำ Workshop", "🚲 ปั่นจักรยาน"];
    const FOODS = ["อาหารไทย", "อาหารญี่ปุ่น", "อาหารอิตาเลียน", "ปิ้งย่าง/ชาบู", "คาเฟ่/ขนม", "สตรีทฟู้ด"];

    let selectedPlaces = new Set();
    let selectedActivities = new Set();
    let selectedFoods = new Set();
    let runCount = 0;

    window.onload = () => {
      emailjs.init(EMAILJS_PUBLIC_KEY);
      renderChips('places-container', PLACES, selectedPlaces, togglePlace);
      renderChips('activities-container', ACTIVITIES, selectedActivities, toggleActivity);
      renderChips('foods-container', FOODS, selectedFoods, toggleFood);
      
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('date-input').value = today;
      document.getElementById('date-input').min = today;
    };

    function playHaptic(type = 'light') {
      if (window.navigator && window.navigator.vibrate) {
        if (type === 'light') window.navigator.vibrate(20);
        else if (type === 'medium') window.navigator.vibrate(50);
        else if (type === 'heavy') window.navigator.vibrate([50, 30, 50]);
      }
    }

    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      window.scrollTo(0, 0);
    }

    function openEnvelope() {
      playHaptic('medium');
      const env = document.getElementById('envelope');
      env.classList.add('open-anim');
      setTimeout(() => showScreen('screen-intro'), 1000);
    }

    function runAway() {
      if (runCount >= 5) return;
      runCount++;
      playHaptic('light');
      const btn = document.getElementById('btn-no');
      
      const padding = 20;
      const btnWidth = btn.offsetWidth || 150;
      const btnHeight = btn.offsetHeight || 50;
      
      const maxWidth = window.innerWidth - btnWidth - (padding * 2);
      const maxHeight = window.innerHeight - btnHeight - (padding * 2);
      
      const x = padding + Math.random() * maxWidth;
      const y = padding + Math.random() * maxHeight;
      
      btn.style.position = 'fixed';
      btn.style.left = x + 'px';
      btn.style.top = y + 'px';
      btn.style.zIndex = '1000';
      btn.innerText = ["ไม่ง่ายหรอก 😜", "ลองใหม่นะ", "เกือบโดนแล้ว", "ฮั่นแน่!", "ทิ้งลงถังขยะเลยไหม?"][runCount-1];

      if (runCount === 5) {
        btn.innerText = "เบื่อแล้ว! ทิ้งลงถัง 🗑️";
        btn.style.background = "#ffebee";
        btn.style.color = "#d32f2f";
        document.getElementById('trash-bin').style.display = 'flex';
      }
    }

    function handleNoClick() {
      if (runCount === 5) {
        playHaptic('heavy');
        const btn = document.getElementById('btn-no');
        const bin = document.getElementById('trash-bin');
        
        btn.classList.add('crumple-throw-to-bin');
        
        setTimeout(() => {
          bin.classList.add('shake');
          setTimeout(() => bin.classList.remove('shake'), 400);
        }, 600);

        setTimeout(() => {
          btn.style.display = 'none';
          setTimeout(() => {
            bin.style.animation = "binIn 0.5s ease reverse forwards";
            setTimeout(() => bin.style.display = 'none', 500);
          }, 1000);
        }, 800);
      } else {
        runAway();
      }
    }

    function renderChips(containerId, list, set, callback) {
      const container = document.getElementById(containerId);
      container.innerHTML = list.map(item => `
        <div class="chip ${set.has(item) ? 'selected' : ''}" onclick="${callback.name}('${item}')">${item}</div>
      `).join('');
    }

    function togglePlace(p) {
      playHaptic('light');
      if (selectedPlaces.has(p)) selectedPlaces.delete(p);
      else selectedPlaces.add(p);
      renderChips('places-container', [...PLACES, ...Array.from(selectedPlaces).filter(x => !PLACES.includes(x))], selectedPlaces, togglePlace);
    }

    function toggleActivity(a) {
      playHaptic('light');
      if (selectedActivities.has(a)) selectedActivities.delete(a);
      else selectedActivities.add(a);
      renderChips('activities-container', ACTIVITIES, selectedActivities, toggleActivity);
    }

    function toggleFood(f) {
      playHaptic('light');
      if (selectedFoods.has(f)) selectedFoods.delete(f);
      else selectedFoods.add(f);
      renderChips('foods-container', FOODS, selectedFoods, toggleFood);
    }

    function addCustomPlace() {
      const val = document.getElementById('custom-place').value.trim();
      if (val) {
        playHaptic('medium');
        selectedPlaces.add(val);
        document.getElementById('custom-place').value = "";
        renderChips('places-container', [...PLACES, ...Array.from(selectedPlaces).filter(x => !PLACES.includes(x))], selectedPlaces, togglePlace);
      }
    }

    function fireConfetti() {
      const count = 200;
      const defaults = { origin: { y: 0.7 }, zIndex: 3000 };

      function fire(particleRatio, opts) {
        confetti({
          ...defaults,
          ...opts,
          particleCount: Math.floor(count * particleRatio)
        });
      }

      fire(0.25, { spread: 26, startVelocity: 55 });
      fire(0.2, { spread: 60 });
      fire(0.35, { spread: 100, decay: 0.91, scalar: 0.8 });
      fire(0.1, { spread: 120, startVelocity: 25, decay: 0.92, scalar: 1.2 });
      fire(0.1, { spread: 120, startVelocity: 45 });
    }

    async function sendInvite() {
      const date = document.getElementById('date-input').value;
      const time = document.getElementById('time-input').value;
      if (!date || !time || selectedPlaces.size === 0 || selectedFoods.size === 0 || selectedActivities.size === 0) {
        alert('กรุณากรอกข้อมูลให้ครบถ้วนนะ'); return;
      }

      document.getElementById('loading').classList.add('active');
      const placesStr = Array.from(selectedPlaces).join(', ');
      const activitiesStr = Array.from(selectedActivities).join(', ');
      const foodsStr = Array.from(selectedFoods).join(', ');
      const dt = new Date(date + 'T' + time);
      const dateStr = dt.toLocaleDateString('th-TH', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

      try {
        await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
          date: dateStr, 
          time: time + " น.", 
          location: placesStr, 
          activities: activitiesStr,
          foods: foodsStr,
          note: document.getElementById('note-input').value || '-', 
          to_email: RECIPIENT_EMAIL
        });
        
        document.getElementById('loading').classList.remove('active');
        playHaptic('heavy');
        fireConfetti();
        
        document.getElementById('summary-box').innerHTML = `
          <div class="sum-line"><span>วันที่:</span><span class="sum-val">${dateStr}</span></div>
          <div class="sum-line"><span>เวลา:</span><span class="sum-val">${time} น.</span></div>
          <div class="sum-line"><span>สถานที่:</span><span class="sum-val">${placesStr}</span></div>
          <div class="sum-line"><span>กิจกรรม:</span><span class="sum-val">${activitiesStr}</span></div>
          <div class="sum-line"><span>อาหาร:</span><span class="sum-val">${foodsStr}</span></div>
        `;
        showScreen('screen-success');
      } catch (e) {
        document.getElementById('loading').classList.remove('active');
        alert('เกิดข้อผิดพลาด ลองใหม่อีกครั้งนะ');
      }
    }
  </script>
</body>
</html>
